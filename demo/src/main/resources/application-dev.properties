# Development profile with H2 in-memory database
# Run with: ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev

spring.application.name=demo
server.servlet.context-path=/api/v1
server.error.include-stacktrace=never

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:demodev;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (optional, for debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true

# Connection Pool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.pool-name=demo-dev-pool

# MFA/OTP Configuration
app.mfa.otp-exp-minutes=10
app.mfa.max-attempts=5

# Auth Configuration
app.auth.max-failed=5
app.auth.window-minutes=15
app.auth.block-minutes=30

# JWT Configuration
security.jwt.issuer=demo-dev.local
security.jwt.secret-key=dev-secret-key-change-in-production-minimum-32-chars
security.jwt.access-token-validity-minutes=60

# Email Configuration (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=drealexander.dev@gmail.com
spring.mail.password=${EMAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
